services:
  # ----------------------
  # Frontend (React + Phaser)
  # ----------------------
  frontend:
    build: ./codequest
    container_name: codequest-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./codequest/src:/app/src
      - ./codequest/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm start
    depends_on:
      - directus
      - piston
      

  # ----------------------
  # Piston Code Execution Engine
  # ----------------------
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: codequest-piston
    restart: always
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp
    environment:
      - PISTON_ALLOW_REMOTE_IMAGES=true

  # ----------------------
  # MySQL for Directus
  # ----------------------
  db:
    image: mysql:8.0
    container_name: codequest-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # ----------------------
  # Directus CMS
  # ----------------------
  directus:
    image: directus/directus:latest
    container_name: codequest-directus
    restart: always
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
      CORS_CREDENTIALS: "true"
    depends_on:
      - db


volumes:
  db_data:
  piston_packages:
